[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riemannian-fluids"
version = "0.2.0"
description = "Minimal executable research on geometry and Riemannian fluid equations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jax==0.8.3",
  "numpy>=2.4,<2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<0.15",
]

[project.scripts]
riemannian-fluids = "experiments.__main__:main"
geometric-viscosity = "experiments.__main__:main"
riemannian-literature = "reproductions.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["riemannian_fluids", "experiments", "reproductions"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
